<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A little pause, a great cup. Visit The Daily Grind for freshly brewed coffee and warm welcomes.">
    <title>The Daily Grind | Coffee Shop</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f5efe6;
            color: #34271f;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 720px);
            padding: clamp(32px, 8vw, 80px);
            border: 1px solid #ded0bd;
            border-radius: 24px;
            background: #fffaf2;
            text-align: center;
            box-shadow: 0 20px 60px #34271f0d;
        }

        .cup { margin: 0 0 24px; font-size: 64px; }

        .eyebrow {
            color: #786044;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            margin: 16px 0;
            font-family: Georgia, serif;
            font-size: clamp(40px, 7vw, 64px);
            font-weight: normal;
            line-height: 1.1;
        }

        .intro {
            max-width: 420px;
            margin: 0 auto 32px;
            color: #6c5b4e;
            font-size: 18px;
            line-height: 1.7;
        }

        button {
            padding: 16px 28px;
            border: 0;
            border-radius: 999px;
            background: #3e5540;
            color: white;
            font: bold 16px Arial, sans-serif;
            cursor: pointer;
            transition: background 160ms ease;
        }

        button:hover { background: #2d402f; }
        button:focus-visible { outline: 3px solid #a3733f; outline-offset: 5px; }

        dialog {
            max-width: min(420px, calc(100% - 48px));
            padding: 32px;
            border: 1px solid #ded0bd;
            border-radius: 20px;
            background: #fffaf2;
            color: #34271f;
            text-align: center;
        }

        dialog::backdrop { background: #34271f80; }
        dialog h2 { font-family: Georgia, serif; }
        dialog p { line-height: 1.7; }
    </style>
</head>
<body>
    <main>
        <div class="cup" aria-hidden="true">☕</div>
        <p class="eyebrow">The Daily Grind</p>
        <h1>A little pause.<br>A great cup.</h1>
        <p class="intro">Freshly brewed coffee, something sweet, and a cozy corner to call your own. Make yourself at home.</p>
        <button type="button" commandfor="menu" command="show-modal">Explore our coffee</button>
    </main>

    <dialog id="menu" aria-labelledby="menu-title">
        <h2 id="menu-title">Your next favorite cup</h2>
        <p>Espresso · Americano · Cappuccino · Latte<br>Made fresh, served with a smile.</p>
        <form method="dialog"><button>Lovely, thanks!</button></form>
    </dialog>
</body>
</html>
